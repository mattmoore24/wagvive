name: CJ variant and sizing audit

# Read-only: dumps CJ's full variant list, per-variant dimensions and supplier
# description for every SPU in config/audit_spus.json, so a session without CJ
# credentials can check the store against the source. Commits the result.
#
# Trigger: push a change to config/audit_spus.json on a claude/** branch.
# The results commit only touches docs/qa/cj-variants.json, so it cannot
# retrigger itself.

on:
  push:
    branches: ['claude/**']
    paths: ['config/audit_spus.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recreate CJ credential file from encrypted secrets
        env:
          CJ_EMAIL:    ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY:  ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE: ${{ secrets.CJ_API_BASE }}
        run: |
          set -euo pipefail
          for v in CJ_EMAIL CJ_API_KEY CJ_API_BASE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"; exit 1
            fi
          done
          printf 'CJ_EMAIL=%s\nCJ_API_KEY=%s\nCJ_API_BASE=%s\n' \
            "$CJ_EMAIL" "$CJ_API_KEY" "$CJ_API_BASE" > config/cj.env

      - name: Pull CJ variant and sizing data
        run: |
          mkdir -p docs/qa
          python config/audit_cj_variants.py config/audit_spus.json docs/qa/cj-variants.json

      - name: Remove credential files
        if: always()
        run: rm -f config/cj.env config/cj_token.json

      - name: Commit results to this branch
        run: |
          git config user.name 'wagvive-ops'
          git config user.email 'hello@wagvive.com'
          git add docs/qa/cj-variants.json
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -m "QA: CJ variant and sizing data for the catalogue"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
