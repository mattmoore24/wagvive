name: Fetch CJ reference images

# Read-only QA helper: pulls a CJ product's record and images so a session
# without CJ credentials (e.g. claude.ai/code) can compare our generated
# imagery against the real product. Touches nothing in Shopify or CJ beyond
# authenticated reads; commits the fetched files back to the same branch.
#
# Trigger: commit docs/qa/request.json to a claude/** branch, e.g.
#   {"sku": "CJYD275409401AZ", "label": "dematting",
#    "shopify_image_url": "https://cdn.shopify.com/...png"}
# (workflow_dispatch by filename only works once this file is on the default
# branch — the push trigger is what makes it usable from feature branches.)
#
# No retrigger loop: the results commit only adds docs/qa/<label>/ files and
# the paths filter below only matches docs/qa/request.json.

on:
  push:
    branches: ['claude/**']
    paths: ['docs/qa/request.json']
  workflow_dispatch:
    inputs:
      sku:
        description: 'CJ product SKU (variant SKU or SPU)'
        required: true
      label:
        description: 'Folder name under docs/qa/'
        required: true
      shopify_image_url:
        description: 'Optional current storefront image URL to save alongside'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve parameters (dispatch inputs or docs/qa/request.json)
        id: params
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.sku || '' }}" ]; then
            echo "sku=${{ inputs.sku }}"                         >> "$GITHUB_OUTPUT"
            echo "label=${{ inputs.label }}"                     >> "$GITHUB_OUTPUT"
            echo "shopify_url=${{ inputs.shopify_image_url }}"   >> "$GITHUB_OUTPUT"
          else
            python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('docs/qa/request.json'))
          print(f"sku={r['sku']}")
          print(f"label={r['label']}")
          print(f"shopify_url={r.get('shopify_image_url','')}")
          EOF
          fi

      - name: Recreate CJ credential file from encrypted secrets
        env:
          CJ_EMAIL:    ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY:  ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE: ${{ secrets.CJ_API_BASE }}
        run: |
          set -euo pipefail
          for v in CJ_EMAIL CJ_API_KEY CJ_API_BASE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"; exit 1
            fi
          done
          printf 'CJ_EMAIL=%s\nCJ_API_KEY=%s\nCJ_API_BASE=%s\n' \
            "$CJ_EMAIL" "$CJ_API_KEY" "$CJ_API_BASE" > config/cj.env

      - name: Fetch product record and images
        run: |
          python config/fetch_cj_refs.py \
            "${{ steps.params.outputs.sku }}" \
            "docs/qa/${{ steps.params.outputs.label }}" \
            "${{ steps.params.outputs.shopify_url }}"

      - name: Remove credential files
        if: always()
        run: rm -f config/cj.env config/cj_token.json

      - name: Commit results to this branch
        run: |
          git config user.name 'wagvive-ops'
          git config user.email 'hello@wagvive.com'
          git add "docs/qa/${{ steps.params.outputs.label }}"
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -m "QA: CJ reference images for ${{ steps.params.outputs.label }} (${{ steps.params.outputs.sku }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
