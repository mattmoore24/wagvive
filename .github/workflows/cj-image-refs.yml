name: Fetch CJ reference images

# Read-only QA helper: pulls a CJ product's record and images so a session
# without CJ credentials can compare our generated imagery against the real
# product. Commits the files to the branch it was dispatched on. Touches
# nothing in Shopify or CJ beyond authenticated reads.

on:
  workflow_dispatch:
    inputs:
      sku:
        description: 'CJ product SKU (variant SKU or SPU)'
        required: true
      label:
        description: 'Folder name under docs/qa/'
        required: true
      shopify_image_url:
        description: 'Optional current storefront image URL to save alongside'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recreate CJ credential file from encrypted secrets
        env:
          CJ_EMAIL:    ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY:  ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE: ${{ secrets.CJ_API_BASE }}
        run: |
          set -euo pipefail
          for v in CJ_EMAIL CJ_API_KEY CJ_API_BASE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"; exit 1
            fi
          done
          printf 'CJ_EMAIL=%s\nCJ_API_KEY=%s\nCJ_API_BASE=%s\n' \
            "$CJ_EMAIL" "$CJ_API_KEY" "$CJ_API_BASE" > config/cj.env

      - name: Fetch product record and images
        run: |
          python config/fetch_cj_refs.py \
            "${{ inputs.sku }}" \
            "docs/qa/${{ inputs.label }}" \
            "${{ inputs.shopify_image_url }}"

      - name: Remove credential files
        if: always()
        run: rm -f config/cj.env config/cj_token.json

      - name: Commit results to this branch
        run: |
          git config user.name 'wagvive-ops'
          git config user.email 'hello@wagvive.com'
          git add docs/qa/
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -m "QA: CJ reference images for ${{ inputs.label }} (${{ inputs.sku }})"
          git push origin "HEAD:${{ github.ref_name }}"
