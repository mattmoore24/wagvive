name: Scheduled store operations

# Keeps Wagvive's stock and margins correct without any device being awake.
#
# SAFETY POSTURE — deliberate, do not loosen without thinking it through:
#   * Only the two provably-safe repairs run with --apply:
#       sync_inventory.py  copies CJ stock to the sellable location
#       fix_locations.py   strips service-location levels (double-count fix)
#       guard_unshippable.py  holds at 0 anything CJ has no stock record for,
#                             then asserts on the STOREFRONT that none of them
#                             is orderable. This is the order #1002 guard: that
#                             order sold an item CJ could not send, and every
#                             check at the time passed because they all asked
#                             whether Shopify MATCHED CJ's number, never whether
#                             that number meant shippable.
#   * margin_guard.py runs REPORT-ONLY. It never changes prices unattended.
#     If any variant is under ITS OWN floor from config/price_book.json the job
#     FAILS, which emails you. Repricing stays a human decision.
#     (This comment said "the 50% floor" until 2026-08-31. The flat 50% was
#     retired on 2026-08-04 and floors have been per-product ever since - median
#     17.5%, range 2.0% to 41.7%. Exactly the stale-number trap CLAUDE.md
#     non-negotiable #1 exists to warn about, sitting in the workflow that
#     enforces it.)
#   * margin_guard exit codes are NOT interchangeable: 1 = a real breach, a
#     price must move; 3 = COULD NOT VERIFY, CJ did not answer enough for the
#     run to mean anything and no price is known to be wrong. Actions fails the
#     job on either, so READ THE LOG before reacting to a failure email.
#   * CADENCE IS 6-HOURLY AGAIN (2026-08-19, later the same day it was cut to
#     12-hourly). The 12-hourly cut existed because this was a PRIVATE repo on
#     the Free plan's 2,000 Actions minutes/month, and at 6-hourly the job
#     needed ~2,675. The repo went PUBLIC on 2026-08-19 (owner decision, after
#     a full history scrub and deletion of the Shopify app whose client_secret
#     had leaked into history - see docs/knowledge/going-public-2026-08.md), and
#     public repos get unlimited standard-runner minutes, so the Actions budget
#     no longer constrains cadence.
#
#     What still DOES constrain it: CJ's daily API points budget
#     (docs/knowledge/cj-api-points-quota.md). This job makes ~300 CJ calls per
#     run across the two guards (~600/day at 6-hourly), and the two guards
#     duplicate the same freight quotes - deduplicating them would halve that.
#     If interactive CJ-heavy work exhausts the quota again, cut cadence or do
#     the dedupe rather than letting margin_guard's coverage gate fail runs.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, offset off the hour
  workflow_dispatch:          # lets you run it on demand from the Actions tab

concurrency:
  group: store-ops
  cancel-in-progress: false   # never interrupt a run that is mid-write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 50, not 30. A measured run is about 22 minutes and the 30 minute ceiling
    # left almost no headroom, so a slow spell at CJ timed the job out and
    # notified a failure that was not a real problem. This grows with the
    # catalogue, so measure again if products are added in bulk.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recreate credential files from encrypted secrets
        env:
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_STORE_DOMAIN:    ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_API_VERSION:     ${{ secrets.SHOPIFY_API_VERSION }}
          CJ_EMAIL:                ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY:              ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE:             ${{ secrets.CJ_API_BASE }}
        run: |
          set -euo pipefail
          for v in SHOPIFY_ADMIN_API_TOKEN SHOPIFY_STORE_DOMAIN SHOPIFY_API_VERSION \
                   CJ_EMAIL CJ_API_KEY CJ_API_BASE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"; exit 1
            fi
          done
          printf 'SHOPIFY_ADMIN_API_TOKEN=%s\nSHOPIFY_STORE_DOMAIN=%s\nSHOPIFY_API_VERSION=%s\n' \
            "$SHOPIFY_ADMIN_API_TOKEN" "$SHOPIFY_STORE_DOMAIN" "$SHOPIFY_API_VERSION" > config/shopify.env
          printf 'CJ_EMAIL=%s\nCJ_API_KEY=%s\nCJ_API_BASE=%s\n' \
            "$CJ_EMAIL" "$CJ_API_KEY" "$CJ_API_BASE" > config/cj.env
          echo "credential files written (values masked by Actions)"

      - name: Mirror CJ stock to the sellable location
        run: python config/sync_inventory.py --apply

      - name: Repair inventory locations (undo any CJ double-count)
        run: python config/fix_locations.py --apply

      # Runs AFTER the two writes above, so it grades the state customers see
      # rather than the state we intended. Fails the job if anything CJ cannot
      # ship is still orderable.
      - name: Hold back anything CJ cannot ship, and prove it is off sale
        run: python config/guard_unshippable.py --apply

      - name: Margin floor check (report only — fails the job on a breach)
        run: python config/margin_guard.py

      - name: Remove credential files
        if: always()
        run: rm -f config/shopify.env config/cj.env config/cj_token.json
